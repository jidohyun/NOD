[tools]
bun = "1.4.0"

[tasks.dev]
description = "Start the Nod Worker locally"
dir = "apps/nod"
run = "bun run dev"

[tasks.install]
description = "Install Nod dependencies from the lockfile"
dir = "apps/nod"
run = "bun install --frozen-lockfile"

[tasks.check]
description = "Check Nod JavaScript syntax"
dir = "apps/nod"
run = "bun run check"

[tasks.build]
description = "Dry-run the Nod Worker build"
dir = "apps/nod"
run = "bun run build"

[tasks."db:local"]
description = "Apply Nod D1 migrations to local state"
dir = "apps/nod"
run = "bun run db:local"

[tasks."db:remote"]
description = "Apply Nod D1 migrations to the remote database"
dir = "apps/nod"
run = "bunx wrangler d1 migrations apply nod-links --remote"

[tasks.deploy]
description = "Deploy the Nod Worker to production"
dir = "apps/nod"
run = "bunx wrangler deploy"
