<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FFFDFA" />
    <meta name="description" content="NOD gives every link you save a place. No summaries, no tags. Just the link, in the order you saved it." />
    <meta property="og:title" content="NOD — Every link gets a place." />
    <meta property="og:description" content="No summaries, no tags. Just the link, in the order you saved it." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://nod-archive.com/" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/nod-favicon-32.png" />
    <title>NOD — Every link gets a place.</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/landing.css" />
    <script src="/landing.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div id="app" class="app-shell" aria-live="polite"></div>

    <template id="nod-landing">
      <div class="nod-landing">
        <header class="ld-header">
          <div class="ld-wrap ld-header__row">
            <a class="ld-brand" href="/" aria-label="NOD home"><img src="/assets/nod-logo.png" alt="NOD" width="480" height="120" /></a>
            <a class="ld-header__link" href="/auth/google">Sign in</a>
          </div>
        </header>

        <main>
          <section class="ld-hero" data-scene="hero" aria-labelledby="hero-title">
            <div class="ld-plate" data-plate>
            <div class="ld-wrap ld-hero__inner" data-hero-copy>
              <p class="ld-cap">NOD · A ledger for links</p>
              <h1 id="hero-title" class="ld-display" data-words>Every link gets a place.</h1>
              <p class="ld-lede">No summaries. No tags. Just the link, in the order you saved it.</p>
              <div class="ld-hero__action">
                <a class="ld-cta" href="/auth/google" data-magnet><span>Start with Google</span><span class="ld-cta__arrow" aria-hidden="true">→</span></a>
                <p class="ld-cap ld-hero__message" data-message role="status" hidden></p>
              </div>
            </div>
              <div class="ld-plate__stage">
                <div class="ld-plate__cam" data-cam>
                  <picture>
                    <source type="image/avif" srcset="/assets/generated/ledger-plate-768.avif 768w, /assets/generated/ledger-plate-1536.avif 1536w" sizes="100vw" />
                    <img class="ld-plate__img" src="/assets/generated/ledger-plate-1536.webp" srcset="/assets/generated/ledger-plate-768.webp 768w, /assets/generated/ledger-plate-1536.webp 1536w" sizes="100vw" width="1536" height="1024" alt="An open paper ledger on a desk" fetchpriority="high" decoding="async" />
                  </picture>
                </div>
                <div class="ld-plate__ink" data-ink-mask>
                <div class="ld-plate__inkcam" data-cam-ink>
                  <ol class="ld-page" data-page aria-label="A sample ledger">
                    <li class="ld-entry" data-row><span class="ld-entry__no">0405</span><span class="ld-entry__title">Ask HN: What are you reading?</span><span class="ld-entry__src">news.ycombinator.com</span></li>
                    <li class="ld-entry" data-row><span class="ld-entry__no">0406</span><span class="ld-entry__title">A slower web</span><span class="ld-entry__src">solar.lowtechmagazine.com</span></li>
                    <li class="ld-entry" data-row><span class="ld-entry__no">0407</span><span class="ld-entry__title">Designing calm technology</span><span class="ld-entry__src">calmtech.com</span></li>
                    <li class="ld-entry" data-row><span class="ld-entry__no">0408</span><span class="ld-entry__title">Typography for the web</span><span class="ld-entry__src">webtypography.net</span></li>
                    <li class="ld-entry" data-row><span class="ld-entry__no">0409</span><span class="ld-entry__title">Get started with D1</span><span class="ld-entry__src">developers.cloudflare.com</span></li>
                    <li class="ld-entry" data-row><span class="ld-entry__no">0410</span><span class="ld-entry__title">Optimize Largest Contentful Paint</span><span class="ld-entry__src">web.dev</span></li>
                    <li class="ld-entry" data-row><span class="ld-entry__no">0411</span><span class="ld-entry__title">position: sticky</span><span class="ld-entry__src">developer.mozilla.org</span></li>
                    <li class="ld-entry" data-row><span class="ld-entry__no">0412</span><span class="ld-entry__title">How to write a README people read</span><span class="ld-entry__src">github.com</span></li>
                    <li class="ld-entry ld-entry--new" data-row><span class="ld-entry__no">0413</span><span class="ld-entry__title"><span class="ld-mark" data-hero-mark aria-hidden="true"></span><span data-title>The page you’re reading</span></span><span class="ld-entry__src">nod-archive.com</span></li>
                  </ol>
                </div>
                </div>
                <div class="ld-plate__grain" aria-hidden="true"></div>
                <div class="ld-plate__scrim" data-scrim aria-hidden="true"></div>
              </div>
            </div>
          </section>

          <section class="ld-scene ld-save" data-scene="save" aria-labelledby="save-title">
            <div class="ld-sticky">
              <div class="ld-wrap ld-split">
                <div class="ld-split__copy">
                  <p class="ld-cap">01 — Save</p>
                  <h2 id="save-title" class="ld-h2">One click.<br />One line.</h2>
                  <p class="ld-body">The extension sends the URL and the title. That’s all.</p>
                  <p class="ld-counter" aria-hidden="true"><span class="ld-counter__no">No.</span><span data-counter>0413</span></p>
                </div>
                <div class="ld-split__stage">
                  <div class="ld-browser">
                    <div class="ld-browser__bar" aria-hidden="true"><span class="ld-dot"></span><span class="ld-dot"></span><span class="ld-dot"></span><span class="ld-browser__url">your-next-read.com/article</span></div>
                    <button class="ld-savekey" type="button" data-savekey aria-label="Save a sample link to the ledger"><span class="ld-savekey__face">N</span></button>
                    <span class="ld-cap ld-savekey__hint" aria-hidden="true">Try it</span>
                  </div>
                  <div class="ld-ledger ld-stack" data-stack aria-hidden="true"></div>
                  <div class="ld-drawer" aria-hidden="true">
                    <picture>
                      <source type="image/avif" srcset="/assets/generated/card-drawer-720.avif 720w, /assets/generated/card-drawer-1440.avif 1440w" sizes="(max-width: 1024px) 92vw, 48vw" />
                      <img class="ld-drawer__img" src="/assets/generated/card-drawer-1440.webp" srcset="/assets/generated/card-drawer-720.webp 720w, /assets/generated/card-drawer-1440.webp 1440w" sizes="(max-width: 1024px) 92vw, 48vw" width="1440" height="600" alt="" loading="lazy" decoding="async" />
                    </picture>
                    <div class="ld-drawer__slot"><div class="ld-drawer__card" data-card><img src="/assets/generated/card-yellow-240.webp" width="240" height="294" alt="" loading="lazy" decoding="async" /><span class="ld-drawer__shade"></span></div></div>
                  </div>
                  <p class="sr-only" data-save-live aria-live="polite"></p>
                </div>
              </div>
            </div>
          </section>

          <section class="ld-scene ld-cols" data-scene="cols" aria-labelledby="cols-title">
            <div class="ld-sticky">
              <div class="ld-wrap ld-cols__inner">
                <p class="ld-cap">02 — Keep</p>
                <h2 id="cols-title" class="ld-h2">Four columns.<br />Nothing else.</h2>
                <div class="ld-sheet" data-sheet aria-hidden="true">
                  <div class="ld-sheet__group ld-sheet__keep" data-keep>
                    <div class="ld-col ld-col--no"><span class="ld-col__head">No.</span><span>0413</span><span>0412</span></div>
                    <div class="ld-col ld-col--wide"><span class="ld-col__head">Title</span><span>The page you’re reading</span><span>How to write a README</span></div>
                    <div class="ld-col ld-col--src"><span class="ld-col__head">Source</span><span>nod-archive.com</span><span>github.com</span></div>
                    <div class="ld-col"><span class="ld-col__head">Saved</span><span>just now</span><span>2h ago</span></div>
                  </div>
                  <div class="ld-sheet__group ld-sheet__drop" data-drop>
                    <div class="ld-col" data-dropcol><span class="ld-col__head">Summary</span><span>An AI summary…</span><span>An AI summary…</span></div>
                    <div class="ld-col" data-dropcol><span class="ld-col__head">Tags</span><span>#later #read</span><span>#docs</span></div>
                    <div class="ld-col" data-dropcol><span class="ld-col__head">Folder</span><span>Inbox / Tech</span><span>Reading</span></div>
                    <div class="ld-col" data-dropcol><span class="ld-col__head">Rating</span><span>★★★★☆</span><span>★★★☆☆</span></div>
                  </div>
                </div>
                <p class="ld-body ld-cols__after" data-after>We never read the page. We just keep its place.</p>
                <p class="sr-only">NOD keeps four fields per link: number, title, source, and saved time. It has no summaries, tags, folders, or ratings.</p>
              </div>
            </div>
          </section>

          <section class="ld-scene ld-find" data-scene="find" aria-labelledby="find-title">
            <div class="ld-sticky">
              <div class="ld-wrap ld-split">
                <div class="ld-split__copy">
                  <p class="ld-cap">03 — Find</p>
                  <h2 id="find-title" class="ld-h2">Find it by what you remember.</h2>
                  <p class="ld-body">Search titles and sources. Open it, or let it go.</p>
                </div>
                <div class="ld-split__stage">
                  <label class="ld-search">
                    <span class="sr-only">Search the sample ledger</span>
                    <span class="ld-search__icon" aria-hidden="true">⌕</span>
                    <input type="search" data-search autocomplete="off" spellcheck="false" placeholder="Search" aria-describedby="find-count" />
                    <span class="ld-cap ld-search__count" id="find-count" data-count>6 links</span>
                  </label>
                  <ol class="ld-ledger ld-results" data-results aria-hidden="true">
                    <li class="ld-row" data-row><span class="ld-row__no">0388</span><span class="ld-row__title">Design systems, explained</span><span class="ld-row__src">figma.com</span></li>
                    <li class="ld-row" data-row><span class="ld-row__no">0371</span><span class="ld-row__title">Sourdough starter, day one</span><span class="ld-row__src">seriouseats.com</span></li>
                    <li class="ld-row" data-row><span class="ld-row__no">0302</span><span class="ld-row__title">A design review checklist</span><span class="ld-row__src">medium.com</span></li>
                    <li class="ld-row" data-row><span class="ld-row__no">0277</span><span class="ld-row__title">Rail passes for a week in Japan</span><span class="ld-row__src">japan-guide.com</span></li>
                    <li class="ld-row" data-row><span class="ld-row__no">0215</span><span class="ld-row__title">Why we design in public</span><span class="ld-row__src">linear.app</span></li>
                    <li class="ld-row" data-row><span class="ld-row__no">0190</span><span class="ld-row__title">Postgres indexing basics</span><span class="ld-row__src">postgresql.org</span></li>
                  </ol>
                </div>
              </div>
            </div>
          </section>

          <section id="start" class="ld-closing" data-scene="closing" aria-labelledby="close-title">
            <div class="ld-wrap ld-closing__inner">
              <h2 id="close-title" class="ld-display ld-closing__title"><span class="ld-closing__no">No. 0001</span><span data-words>is yours.</span></h2>
              <a class="ld-cta ld-cta--doodle" href="/auth/google" data-magnet><span>Start with Google</span><span class="ld-cta__arrow" aria-hidden="true">→</span></a>
              <p class="ld-small">Sign in with Google, then add the Chrome extension.</p>
            </div>
          </section>
        </main>

        <footer class="ld-footer">
          <div class="ld-wrap ld-footer__row">
            <a class="ld-brand ld-brand--small" href="/" aria-label="NOD home"><img src="/assets/nod-logo.png" alt="NOD" width="480" height="120" loading="lazy" /></a>
            <nav class="ld-footer__nav" aria-label="Footer">
              <a href="https://github.com/jidohyun/NOD">GitHub</a>
            </nav>
            <span class="ld-cap">© 2026 NOD</span>
          </div>
        </footer>
      </div>
    </template>
  </body>
</html>
