name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/nod/**"
      - "mise.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/nod/**"
      - "mise.toml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nod:
    name: Nod
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/nod
    steps:
      - uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.0"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check syntax
        run: bun run check
      - name: Apply local D1 migrations
        run: bun run db:local
      - name: Dry-run Worker build
        run: bun run build
