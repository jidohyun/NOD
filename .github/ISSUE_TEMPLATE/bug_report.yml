name: Bug Report
description: Report a problem with Nod
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Nod web app
        - Chrome extension
        - Worker or D1
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Explain what happened and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS:
        - Browser:
        - Extension version (if applicable):
