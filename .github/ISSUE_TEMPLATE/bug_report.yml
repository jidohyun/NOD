name: Bug Report
description: Report a bug to help us improve NOD
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: dropdown
    id: app
    attributes:
      label: App
      description: Which part of NOD is affected?
      options:
        - Web (nod-archive.com)
        - Chrome Extension
        - API
        - Mobile
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what you see!
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please provide the following info:
      placeholder: |
        - OS: [e.g. macOS 15, Windows 11]
        - Browser: [e.g. Chrome 130]
        - Extension version: [e.g. 1.3.2]
      render: markdown

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
