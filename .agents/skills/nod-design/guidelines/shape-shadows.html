<!-- @dsCard group="Shape" viewport="700x160" name="Borders, shadows, tilt" subtitle="Flat offset shadows, doodle borders, ±1–6° tilt" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"></head>
<body style="margin:0;padding:20px;background:var(--surface-page);"><div style="display:flex;gap:28px;align-items:center;padding:8px 12px"><div style="display:grid;gap:8px;justify-items:center"><div style="width:84px;height:64px;background:#fff;border:var(--border-doodle);border-radius:var(--radius-doodle);box-shadow:var(--shadow-sketch);transform:rotate(0deg)"></div><span style="font-size:12px;color:var(--text-secondary)">sketch</span></div><div style="display:grid;gap:8px;justify-items:center"><div style="width:84px;height:64px;background:#fff;border:var(--border-doodle-emphasis);border-radius:var(--radius-doodle);box-shadow:var(--shadow-sketch-large);transform:rotate(0deg)"></div><span style="font-size:12px;color:var(--text-secondary)">sketch-large</span></div><div style="display:grid;gap:8px;justify-items:center"><div style="width:84px;height:64px;background:#fff;border:var(--border-doodle-emphasis);border-radius:var(--radius-doodle);box-shadow:var(--shadow-sketch-hover);transform:rotate(0deg)"></div><span style="font-size:12px;color:var(--text-secondary)">sketch-hover</span></div><div style="display:grid;gap:8px;justify-items:center"><div style="width:84px;height:64px;background:#fff;border:var(--border-doodle);border-radius:var(--radius-doodle);box-shadow:var(--shadow-sketch);transform:rotate(-1.25deg)"></div><span style="font-size:12px;color:var(--text-secondary)">tilt −1.25°</span></div><div style="display:grid;gap:8px;justify-items:center"><div style="width:84px;height:64px;background:#fff;border:var(--border-doodle);border-radius:var(--radius-doodle);box-shadow:var(--shadow-sketch-large);transform:rotate(3deg)"></div><span style="font-size:12px;color:var(--text-secondary)">tilt 3°</span></div><div style="display:grid;gap:8px;justify-items:center"><div style="width:84px;height:64px;background:#fff;border:var(--border-dashed);border-radius:var(--radius-doodle);box-shadow:none;transform:rotate(0deg)"></div><span style="font-size:12px;color:var(--text-secondary)">dashed</span></div></div></body></html>
