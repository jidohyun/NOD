<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOD - Verify your email</title>
</head>
<body style="margin:0;padding:0;background-color:#f5f3ee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f5f3ee;padding:40px 20px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background-color:#ffffff;border-radius:12px;border:1px solid #e8e4dc;overflow:hidden;">
          <tr>
            <td style="padding:32px 40px 24px;text-align:center;border-bottom:1px solid #f0ece4;">
              <div style="display:inline-block;background-color:#fdf8e8;border-radius:8px;padding:8px 16px;">
                <span style="font-size:20px;font-weight:800;color:#1a1a1a;letter-spacing:1px;">NOD</span>
              </div>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 40px;">
              <h1 style="margin:0 0 12px;font-size:22px;font-weight:700;color:#1a1a1a;">
                Verify your email
              </h1>
              <p style="margin:0 0 28px;font-size:15px;line-height:1.6;color:#555;">
                Thanks for signing up for NOD.<br/>
                Click the button below to verify your email address.
              </p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                <tr>
                  <td align="center">
                    <a href="{{ .ConfirmationURL }}"
                       target="_blank"
                       style="display:inline-block;background-color:#c49a1c;color:#000000;font-size:15px;font-weight:700;text-decoration:none;padding:14px 36px;border-radius:8px;letter-spacing:0.3px;">
                      Verify Email
                    </a>
                  </td>
                </tr>
              </table>
              <p style="margin:28px 0 0;font-size:13px;line-height:1.6;color:#999;">
                If the button doesn't work, copy and paste this link into your browser:<br/>
                <a href="{{ .ConfirmationURL }}" style="color:#c49a1c;word-break:break-all;">{{ .ConfirmationURL }}</a>
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 40px 28px;border-top:1px solid #f0ece4;text-align:center;">
              <p style="margin:0;font-size:12px;color:#aaa;">
                NOD &mdash; AI-powered content saving and knowledge management
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
